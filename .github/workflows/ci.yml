name: Orthotect Architecture CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run Deterministic Quality Gates
        run: |
          python3 gates/run_all_gates.py examples/golden-showcase

      - name: Test CLI Installation
        run: |
          node bin/orthotect.js list
          node bin/orthotect.js verify examples/golden-showcase
