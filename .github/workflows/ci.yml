name: Orthotect Architecture CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Run Unit, Browser & Negative Gate Tests (225+ Tests)
        run: |
          npm test

      - name: Verify Knowledge Base Schema & Search Quality Benchmark (32 Queries)
        run: |
          python3 core/knowledge_search.py --validate
          python3 core/knowledge_search.py --validate --fallback
          python3 core/knowledge_search.py --benchmark

      - name: Verify Documentation & Skill Studio Gates
        run: |
          node bin/orthotect.js verify docs

      - name: Test Real CLI Scaffolding and Verification
        run: |
          rm -rf /tmp/ci_test_project
          mkdir -p /tmp/ci_test_project
          node bin/orthotect.js init /tmp/ci_test_project
          cp examples/golden-showcase/index.html /tmp/ci_test_project/
          node bin/orthotect.js verify /tmp/ci_test_project

      - name: Test Style Recipe Page Scaffolding
        run: |
          node bin/orthotect.js design page contemporary-product-saas --out /tmp/ci_test_project/scaffold.html
          node bin/orthotect.js verify /tmp/ci_test_project

      - name: Test W3C DTCG Token Compiler
        run: |
          node bin/orthotect.js compile core/tokens --out /tmp/ci_tokens.css
          test -s /tmp/ci_tokens.css

      - name: Test Reporting Formats (JSON & Markdown)
        run: |
          node bin/orthotect.js verify examples/golden-showcase --json
          node bin/orthotect.js verify examples/golden-showcase --md

      - name: Verify NPM Package Tarball Integrity
        run: |
          npm pack --dry-run
