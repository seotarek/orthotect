name: Orthotect Architecture CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit & E2E Negative Tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run Deterministic Quality Gates on Showcase
        run: |
          python3 gates/run_all_gates.py examples/golden-showcase

      - name: Test Real CLI Scaffolding and Verification
        run: |
          mkdir -p /tmp/ci_test_project
          node bin/orthotect.js init /tmp/ci_test_project
          cp examples/golden-showcase/index.html /tmp/ci_test_project/
          node bin/orthotect.js verify /tmp/ci_test_project
