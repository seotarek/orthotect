name: Publish Orthotect to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@seotarek'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Run Pre-Publish Verification Suite & Gates
        run: |
          npm test
          python3 gates/run_all_gates.py docs
          python3 gates/run_all_gates.py examples/golden-showcase

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
