name: Publish Orthotect to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@seotarek'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Verify package metadata consistency
        run: npm run check:package-metadata

      - name: Run Pre-Publish Verification Suite & Gates
        run: |
          npm test
          python3 gates/run_all_gates.py docs
          python3 gates/run_all_gates.py examples/golden-showcase

      - name: Check if Version Already Published to GitHub Packages
        id: check_gh_pkg
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          GH_PKG_NAME="${PACKAGE_NAME}"
          if [[ ! "${PACKAGE_NAME}" =~ ^@ ]]; then
            GH_PKG_NAME="@${{ github.repository_owner }}/${PACKAGE_NAME}"
          fi
          echo "Target version: ${CURRENT_VERSION}"
          echo "GitHub Package target: ${GH_PKG_NAME}"
          echo "gh_pkg_name=${GH_PKG_NAME}" >> "$GITHUB_OUTPUT"

          set +e
          CHECK_OUTPUT=$(npm view "${GH_PKG_NAME}@${CURRENT_VERSION}" version --registry=https://npm.pkg.github.com 2>&1)
          CHECK_STATUS=$?
          set -e

          if [ "$CHECK_STATUS" -eq 0 ]; then
            echo "Version ${CURRENT_VERSION} is already published on GitHub Packages."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif echo "$CHECK_OUTPUT" | grep -Eqi '(E404|404 Not Found|No match found for version|not in this registry)'; then
            echo "Version ${CURRENT_VERSION} is not yet published on GitHub Packages."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Status indeterminate, will attempt publish: $CHECK_OUTPUT"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' && steps.check_gh_pkg.outputs.already_published != 'true'
        continue-on-error: true
        run: |
          GH_PKG_NAME="${{ steps.check_gh_pkg.outputs.gh_pkg_name }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '${GH_PKG_NAME}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --registry=https://npm.pkg.github.com
          git checkout package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Version Already Published to Public npmjs.org
        id: check_npm_org
        if: github.event_name == 'release' && secrets.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          set +e
          CHECK_NPM=$(npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version --registry=https://registry.npmjs.org 2>&1)
          STATUS_NPM=$?
          set -e
          if [ "$STATUS_NPM" -eq 0 ]; then
            echo "Version ${CURRENT_VERSION} is already live on npmjs.org."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${CURRENT_VERSION} is not yet on npmjs.org."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Public npmjs.org Registry
        if: github.event_name == 'release' && secrets.NPM_TOKEN != '' && steps.check_npm_org.outputs.already_published != 'true'
        run: npm publish --access=public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Manual run publication note
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch intentionally runs verification/check steps only."
          echo "Canonical publishing path is the release-published event."
