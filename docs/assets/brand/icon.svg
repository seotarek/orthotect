<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" role="img" aria-label="Orthotect Icon">
  <defs>
    <linearGradient id="otBlueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#1F69FF"/>
      <stop offset="100%" stop-color="#7B42F6"/>
    </linearGradient>
    <linearGradient id="otCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#1F69FF"/>
    </linearGradient>
    <linearGradient id="otBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F69FF"/>
      <stop offset="100%" stop-color="#7B42F6"/>
    </linearGradient>
    <linearGradient id="otPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B42F6"/>
      <stop offset="100%" stop-color="#9d66ff"/>
    </linearGradient>
    <filter id="otGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#otGlow)">
    <!-- Left Isometric Face (Interlocking 'O' Module) -->
    <path d="M48 18 L18 35 L18 78 L34 88 L34 50 L48 42 Z" fill="url(#otCyanBlue)"/>
    <path d="M34 88 L48 97 L65 87 L65 72 L48 81 L34 73 Z" fill="url(#otBluePurple)"/>

    <!-- Verification Checkmark (Core of the Structure) -->
    <path d="M38 66 L52 80 L76 46 L68 40 L52 64 L44 56 Z" fill="url(#otBlueCyan)"/>

    <!-- Top Isometric Face -->
    <path d="M48 18 L68 29 L54 38 L34 26 Z" fill="#00D2FF" fill-opacity="0.85"/>
    <path d="M72 31 L88 40 L74 48 L58 39 Z" fill="#1F69FF" fill-opacity="0.9"/>

    <!-- Right Isometric Face Grid Modules ('T' Verification Grid) -->
    <!-- Grid tile 1 (Top Left) -->
    <path d="M68 29 L82 37 L82 48 L68 40 Z" fill="url(#otCyanBlue)"/>
    <!-- Grid tile 2 (Top Right) -->
    <path d="M86 39 L100 47 L100 58 L86 50 Z" fill="url(#otBlueCyan)"/>
    <!-- Grid tile 3 (Middle Left) -->
    <path d="M76 49 L90 57 L90 68 L76 60 Z" fill="url(#otBluePurple)"/>
    <!-- Grid tile 4 (Middle Right) -->
    <path d="M92 59 L104 66 L104 77 L92 70 Z" fill="url(#otBlueCyan)"/>
    <!-- Grid tile 5 (Bottom Left) -->
    <path d="M76 64 L90 72 L90 84 L76 76 Z" fill="url(#otPurple)"/>
    <!-- Grid tile 6 (Bottom Right) -->
    <path d="M92 73 L104 80 L104 92 L92 85 Z" fill="url(#otBluePurple)"/>
  </g>
</svg>
